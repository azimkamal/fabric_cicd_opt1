# .github/workflows/deploy-prod.yml
# Trigger: PR merged into main branch
# Purpose: Deploy to Prod workspace — requires approval gate

# .github/workflows/deploy-prod.yml
name: Deploy to Prod

on:
  push:
    branches:
      - main
    paths:
      - 'fabric/**'

jobs:
  deploy-prod:
    name: Sync Prod Workspace from main branch
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get Fabric Access Token via Service Principal
        run: |
          TOKEN=$(curl -s -X POST \
            https://login.microsoftonline.com/${{ secrets.AZURE_TENANT_ID }}/oauth2/v2.0/token \
            -d 'grant_type=client_credentials' \
            -d 'client_id=${{ secrets.AZURE_CLIENT_ID }}' \
            -d 'client_secret=${{ secrets.AZURE_CLIENT_SECRET }}' \
            -d 'scope=https://api.fabric.microsoft.com/.default' \
            | jq -r '.access_token')
          echo "ACCESS_TOKEN=$TOKEN" >> $GITHUB_ENV

      - name: Get Git Status — Extract workspaceHead and remoteCommitHash
        run: |
          STATUS=$(curl -s -X GET \
            "https://api.fabric.microsoft.com/v1/workspaces/${{ secrets.PROD_WORKSPACE_ID }}/git/status" \
            -H "Authorization: Bearer $ACCESS_TOKEN")
          echo "Git status response: $STATUS"
          WORKSPACE_HEAD=$(echo $STATUS | jq -r '.workspaceHead // empty')
          REMOTE_COMMIT=$(echo $STATUS | jq -r '.remoteCommitHash // empty')
          echo "WORKSPACE_HEAD=$WORKSPACE_HEAD" >> $GITHUB_ENV
          echo "REMOTE_COMMIT=$REMOTE_COMMIT" >> $GITHUB_ENV

      - name: UpdateFromGit — Sync Prod Workspace
        run: |
          PAYLOAD=$(python3 -c "
          import json
          payload = {
            'workspaceHead': '$WORKSPACE_HEAD',
            'remoteCommitHash': '$REMOTE_COMMIT',
            'conflictResolution': {
              'conflictResolutionType': 'Workspace',
              'conflictResolutionPolicy': 'PreferWorkspace'
            },
            'options': {
              'allowOverrideItems': True
            }
          }
          print(json.dumps(payload))
          ")

          echo "Payload: $PAYLOAD"

          RESPONSE=$(curl -s -w '\n%{http_code}' -X POST \
            "https://api.fabric.microsoft.com/v1/workspaces/${{ secrets.PROD_WORKSPACE_ID }}/git/updateFromGit" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)
          echo "Response: $BODY"
          echo "HTTP Status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "202" ]; then
            echo "Deployment failed with HTTP $HTTP_CODE"
            exit 1
          fi

      - name: Trigger ETL Pipeline in Prod
        run: |
          curl -s -X POST \
            "https://api.fabric.microsoft.com/v1/workspaces/${{ secrets.PROD_WORKSPACE_ID }}/items/${{ secrets.PROD_ETL_PIPELINE_ID }}/jobs/instances?jobType=Pipeline" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json"

      - name: Verify Post-Deploy Git Status
        run: |
          STATUS=$(curl -s -X GET \
            "https://api.fabric.microsoft.com/v1/workspaces/${{ secrets.PROD_WORKSPACE_ID }}/git/status" \
            -H "Authorization: Bearer $ACCESS_TOKEN")
          echo "Post-deploy status: $STATUS"
