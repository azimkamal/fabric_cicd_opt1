# .github/workflows/deploy-dev.yml
# Trigger: PR merged into dev branch
# Purpose: Auto-sync Dev workspace from dev branch (optional convenience)

name: Deploy to Dev

on:
  push:
    branches:
      - dev
    paths:
      - 'fabric/**'

jobs:
  deploy-dev:
    name: Sync Dev Workspace from dev branch
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get Fabric Access Token via Service Principal
        id: get_token
        run: |
          TOKEN=$(curl -s -X POST \
            https://login.microsoftonline.com/${{ secrets.AZURE_TENANT_ID }}/oauth2/v2.0/token \
            -d 'grant_type=client_credentials' \
            -d 'client_id=${{ secrets.AZURE_CLIENT_ID }}' \
            -d 'client_secret=${{ secrets.AZURE_CLIENT_SECRET }}' \
            -d 'scope=https://api.fabric.microsoft.com/.default' \
            | jq -r '.access_token')
          echo "ACCESS_TOKEN=$TOKEN" >> $GITHUB_ENV

      - name: Get Git Status of Dev Workspace
        run: |
          STATUS=$(curl -s -X GET \
            "https://api.fabric.microsoft.com/v1/workspaces/${{ secrets.DEV_WORKSPACE_ID }}/git/status" \
            -H "Authorization: Bearer $ACCESS_TOKEN")
          echo "Pre-deploy git status: $STATUS"

      - name: UpdateFromGit — Sync Dev Workspace
        run: |
          COMMIT_SHA="${{ github.sha }}"

          PAYLOAD=$(cat <<EOF
          {
            "workspaceHead": {
              "sourceControlVersion": {
                "commitId": "$COMMIT_SHA"
              }
            },
            "options": {
              "allowOverrideItems": true
            }
          }
          EOF
          )

          RESPONSE=$(curl -s -w '\n%{http_code}' -X POST \
            "https://api.fabric.microsoft.com/v1/workspaces/${{ secrets.DEV_WORKSPACE_ID }}/git/updateFromGit" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)
          echo "Response: $BODY"
          echo "HTTP Status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "202" ]; then
            echo "Deployment failed with HTTP $HTTP_CODE"
            exit 1
          fi

      - name: Verify Sync Completed
        run: |
          STATUS=$(curl -s -X GET \
            "https://api.fabric.microsoft.com/v1/workspaces/${{ secrets.DEV_WORKSPACE_ID }}/git/status" \
            -H "Authorization: Bearer $ACCESS_TOKEN")
          echo "Post-sync status: $STATUS"
