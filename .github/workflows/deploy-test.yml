# .github/workflows/deploy-test.yml
# Trigger: PR merged into test branch
# Purpose: Deploy to Test workspace — requires approval gate

name: Deploy to Test

on:
  push:
    branches:
      - test
    paths:
      - 'fabric/**'

jobs:
  deploy-test:
    name: Sync Test Workspace from test branch
    runs-on: ubuntu-latest
    environment: test   # <-- approval gate configured in GitHub Environments

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get Fabric Access Token via Service Principal
        id: get_token
        run: |
          TOKEN=$(curl -s -X POST \
            https://login.microsoftonline.com/${{ secrets.AZURE_TENANT_ID }}/oauth2/v2.0/token \
            -d 'grant_type=client_credentials' \
            -d 'client_id=${{ secrets.AZURE_CLIENT_ID }}' \
            -d 'client_secret=${{ secrets.AZURE_CLIENT_SECRET }}' \
            -d 'scope=https://api.fabric.microsoft.com/.default' \
            | jq -r '.access_token')
          echo "ACCESS_TOKEN=$TOKEN" >> $GITHUB_ENV

      - name: Get Git Status of Test Workspace
        run: |
          STATUS=$(curl -s -X GET \
            'https://api.fabric.microsoft.com/v1/workspaces/${{ secrets.TEST_WORKSPACE_ID }}/git/status' \
            -H 'Authorization: Bearer '$ACCESS_TOKEN)
          echo "Pre-deploy git status: $STATUS"

      - name: UpdateFromGit — Sync Test Workspace
        run: |
          COMMIT_SHA="${{ github.sha }}"

          PAYLOAD=$(cat <<EOF
          {
            "workspaceHead": {
              "sourceControlVersion": {
                "commitId": "$COMMIT_SHA"
              }
            },
            "options": {
              "allowOverrideItems": true
            }
          }
          EOF
          )

          RESPONSE=$(curl -s -w '\n%{http_code}' -X POST \
            "https://api.fabric.microsoft.com/v1/workspaces/${{ secrets.TEST_WORKSPACE_ID }}/git/updateFromGit" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)
          echo "Response: $BODY"
          echo "HTTP Status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "202" ]; then
            echo "Deployment failed with HTTP $HTTP_CODE"
            exit 1
          fi

      - name: Trigger ETL Pipeline in Test
        run: |
          curl -s -X POST \
            'https://api.fabric.microsoft.com/v1/workspaces/${{ secrets.TEST_WORKSPACE_ID }}/items/${{ secrets.TEST_ETL_PIPELINE_ID }}/jobs/instances?jobType=Pipeline' \
            -H 'Authorization: Bearer '$ACCESS_TOKEN \
            -H 'Content-Type: application/json'

      - name: Verify Post-Deploy Git Status
        run: |
          STATUS=$(curl -s -X GET \
            'https://api.fabric.microsoft.com/v1/workspaces/${{ secrets.TEST_WORKSPACE_ID }}/git/status' \
            -H 'Authorization: Bearer '$ACCESS_TOKEN)
          echo "Post-deploy status: $STATUS"
